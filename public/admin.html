<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>터미널 입력</title>
<style>
  :root { --bg:#fff; --fg:#1b2733; --muted:#6b7a89; --line:#e3e8ee; --accent:#0b6bcb; --warn:#b25e00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10161d; --fg:#e6edf3; --muted:#8b98a5; --line:#26303b; --accent:#58a6ff; --warn:#e3a04b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  main { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 54px); }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  aside { border-right:1px solid var(--line); overflow:auto; max-height:calc(100vh - 54px); }
  aside button { display:block; width:100%; text-align:left; padding:10px 16px; border:0; border-bottom:1px solid var(--line); background:none; color:var(--fg); font-size:14px; cursor:pointer; }
  aside button.on { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  section { padding:16px; max-width:820px; }
  h2 { font-size:16px; margin:24px 0 8px; } h2:first-child { margin-top:0; }
  label { display:block; font-size:13px; color:var(--muted); margin-top:10px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #map { height:300px; border:1px solid var(--line); border-radius:10px; margin-top:8px; }
  .btn { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:none; color:var(--fg); font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:#c62828; }
  .bar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .photos { display:flex; gap:10px; flex-wrap:wrap; }
  .ph { width:140px; font-size:12px; color:var(--muted); }
  .ph img { width:140px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .ph button { margin:2px 4px 0 0; padding:2px 6px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:3px; border-bottom:1px solid var(--line); } th { text-align:left; color:var(--muted); font-weight:500; }
  td input, td select { padding:5px 6px; }
  .warn { color:var(--warn); font-size:13px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:8px 16px; border-radius:20px; display:none; }
</style>
</head>
<body>
<header>
  <h1>여객선 터미널 입력</h1>
  <input id="token" type="password" placeholder="관리자 비밀번호" style="width:160px">
  <a class="btn" href="index.html">지도 보기</a>
</header>
<main>
  <aside><button id="newBtn"><b>+ 새 터미널</b></button><div id="list"></div></aside>
  <section>
    <h2>기본 정보</h2>
    <label>이름 *<input id="name"></label>
    <div class="two">
      <label>시/군<input id="city" placeholder="예: 신안군"></label>
      <label>연락처<input id="phone" placeholder="061-000-0000"></label>
    </div>
    <label>주소<input id="address"></label>
    <label>메모<textarea id="memo" rows="2"></textarea></label>
    <label>위치 * — 지도를 클릭하거나 장소를 검색하세요</label>
    <div class="bar" style="margin-top:0"><input id="kw" placeholder="장소/주소 검색 후 Enter" style="flex:1"></div>
    <div id="map"></div>
    <div class="two"><label>위도<input id="lat"></label><label>경도<input id="lng"></label></div>
    <div class="bar"><button class="btn primary" id="saveBtn">저장</button><button class="btn danger" id="delBtn">삭제</button></div>

    <div id="more" hidden>
      <h2>사진</h2>
      <div class="two">
        <label>종류<select id="kind"><option value="terminal">터미널 사진</option><option value="fare_sheet">운임표</option><option value="timetable">시간표</option></select></label>
        <label>파일<input id="file" type="file" accept="image/*"></label>
      </div>
      <div class="bar"><button class="btn" id="upBtn">업로드</button></div>
      <div class="photos" id="photos" style="margin-top:12px"></div>

      <h2>운임표 (사람·차량·기타)</h2>
      <div class="warn" id="ocrNote"></div>
      <table>
        <thead><tr><th>행선지</th><th>구분</th><th>항목</th><th>금액(원)</th><th>비고</th><th></th></tr></thead>
        <tbody id="fares"></tbody>
      </table>
      <div class="bar"><button class="btn" id="addFare">+ 행 추가</button><button class="btn primary" id="saveFares">운임 저장</button></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let map, marker, geocoder, places, current = null, ocrEnabled = false, terminals = [];
const tokenEl = $('token');
try { tokenEl.value = localStorage.getItem('ferry_token') || ''; } catch (e) {}
tokenEl.onchange = () => { try { localStorage.setItem('ferry_token', tokenEl.value); } catch (e) {} };
const call = (r, o = {}) => api(r, { ...o, token: tokenEl.value });
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
async function guard(fn) { try { await fn(); } catch (e) { toast('오류: ' + e.message); } }

function setPos(lat, lng, pan) {
  $('lat').value = (+lat).toFixed(7); $('lng').value = (+lng).toFixed(7);
  const p = new kakao.maps.LatLng(lat, lng);
  marker.setPosition(p); marker.setMap(map);
  if (pan) map.panTo(p);
}

(async function init() {
  const cfg = await api('config'); ocrEnabled = cfg.ocr_enabled;
  $('ocrNote').textContent = ocrEnabled ? '' : '사진 자동 인식을 쓰려면 api/config.php 에 anthropic_key 를 설정하세요. (수동 입력은 가능)';
  await loadKakao(cfg.kakao_js_key);
  map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(...DEFAULT_CENTER), level: 9 });
  marker = new kakao.maps.Marker();
  geocoder = new kakao.maps.services.Geocoder();
  places = new kakao.maps.services.Places();
  kakao.maps.event.addListener(map, 'click', e => {
    const ll = e.latLng; setPos(ll.getLat(), ll.getLng());
    geocoder.coord2Address(ll.getLng(), ll.getLat(), (r, s) => {
      if (s === kakao.maps.services.Status.OK && !$('address').value) $('address').value = (r[0].road_address || r[0].address).address_name;
    });
  });
  $('kw').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    places.keywordSearch($('kw').value, (r, s) => {
      if (s !== kakao.maps.services.Status.OK) return toast('검색 결과 없음');
      map.setCenter(new kakao.maps.LatLng(r[0].y, r[0].x)); map.setLevel(4);
      if (!$('address').value) $('address').value = r[0].road_address_name || r[0].address_name;
      if (!$('phone').value && r[0].phone) $('phone').value = r[0].phone;
    });
  });
  await refreshList();
  blank();
})().catch(e => toast(e.message));

async function refreshList() {
  terminals = await api('terminals');
  $('list').innerHTML = terminals.map(t => `<button data-id="${t.id}" class="${current && current.id === t.id ? 'on' : ''}">${esc(t.name)}<br><small style="color:var(--muted)">${esc(t.city || '')}</small></button>`).join('');
}
$('list').onclick = e => { const b = e.target.closest('button'); if (b) guard(() => load(+b.dataset.id)); };
$('newBtn').onclick = blank;

function blank() {
  current = null;
  ['name', 'city', 'phone', 'address', 'memo', 'lat', 'lng', 'kw'].forEach(i => $(i).value = '');
  marker.setMap(null); $('more').hidden = true; $('delBtn').hidden = true;
}

async function load(id) {
  current = await api('terminals', { params: { id } });
  ['name', 'city', 'phone', 'address', 'memo'].forEach(i => $(i).value = current[i] || '');
  setPos(current.lat, current.lng, true); map.setLevel(5);
  $('more').hidden = false; $('delBtn').hidden = false;
  renderPhotos(); renderFares(current.fares);
  refreshList();
}

$('saveBtn').onclick = () => guard(async () => {
  const body = { name: $('name').value, city: $('city').value, phone: $('phone').value, address: $('address').value, memo: $('memo').value, lat: $('lat').value, lng: $('lng').value };
  const r = await call('terminals', { method: 'POST', params: current ? { id: current.id } : {}, body });
  toast('저장됨'); await load(r.id);
});
$('delBtn').onclick = () => guard(async () => {
  if (!current || !confirm(`'${current.name}' 터미널과 사진·운임을 모두 삭제할까요?`)) return;
  await call('terminals', { method: 'DELETE', params: { id: current.id } });
  toast('삭제됨'); blank(); refreshList();
});

// ---- 사진 ----
const KIND = { terminal: '터미널', fare_sheet: '운임표', timetable: '시간표' };
function renderPhotos() {
  $('photos').innerHTML = current.photos.map(p => `
    <div class="ph"><a href="../uploads/${esc(p.file_name)}" target="_blank"><img src="../uploads/${esc(p.file_name)}" alt=""></a>
      ${KIND[p.kind]}<br>
      ${p.kind === 'fare_sheet' ? `<button class="btn" data-ocr="${p.id}" ${ocrEnabled ? '' : 'disabled'}>자동 인식</button>` : ''}
      <button class="btn danger" data-del="${p.id}">삭제</button></div>`).join('') || '<span class="warn">사진 없음</span>';
}
$('upBtn').onclick = () => guard(async () => {
  const f = $('file').files[0]; if (!f) return toast('파일을 선택하세요');
  const form = new FormData();
  form.append('terminal_id', current.id); form.append('kind', $('kind').value); form.append('photo', f);
  await call('photos', { method: 'POST', form });
  $('file').value = ''; toast('업로드됨'); await load(current.id);
});
$('photos').onclick = e => {
  const del = e.target.dataset.del, ocr = e.target.dataset.ocr;
  if (del) guard(async () => { if (!confirm('사진을 삭제할까요?')) return; await call('photos', { method: 'DELETE', params: { id: del } }); await load(current.id); });
  if (ocr) guard(async () => {
    e.target.textContent = '인식 중…'; e.target.disabled = true;
    try {
      const r = await call('fares_ocr', { method: 'POST', body: { photo_id: +ocr } });
      renderFares([...collectFares(), ...r.fares.map(f => ({ ...f, source: 'ai', photo_id: r.photo_id }))]);
      toast(r.unreadable ? '불확실: ' + r.unreadable : '인식 완료 — 검수 후 저장하세요');
    } finally { e.target.textContent = '자동 인식'; e.target.disabled = false; }
  });
};

// ---- 운임표 ----
function fareRow(f = {}) {
  const tr = document.createElement('tr');
  tr.dataset.source = f.source || 'manual'; tr.dataset.photo = f.photo_id || '';
  tr.innerHTML = `
    <td><input class="route" value="${esc(f.route_name)}" placeholder="예: 가룡→신의"></td>
    <td><select class="cat">${Object.entries(CAT_LABEL).map(([k, v]) => `<option value="${k}" ${f.category === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
    <td><input class="item" value="${esc(f.item_name)}" placeholder="어른 / 경차 …"></td>
    <td><input class="price" type="number" min="0" value="${f.price ?? ''}"></td>
    <td><input class="note" value="${esc(f.note)}"></td>
    <td><button class="btn" title="삭제">×</button></td>`;
  tr.querySelector('button').onclick = () => tr.remove();
  if (f.source === 'ai') tr.style.background = 'color-mix(in srgb, var(--warn) 12%, transparent)';
  return tr;
}
function renderFares(list) { const tb = $('fares'); tb.innerHTML = ''; list.forEach(f => tb.appendChild(fareRow(f))); }
function collectFares() {
  return [...$('fares').rows].map(tr => ({
    route_name: tr.querySelector('.route').value.trim(), category: tr.querySelector('.cat').value,
    item_name: tr.querySelector('.item').value.trim(), price: tr.querySelector('.price').value,
    note: tr.querySelector('.note').value.trim(), source: tr.dataset.source, photo_id: tr.dataset.photo || null,
  })).filter(f => f.item_name || f.price !== '');
}
$('addFare').onclick = () => $('fares').appendChild(fareRow());
$('saveFares').onclick = () => guard(async () => {
  await call('fares', { method: 'POST', body: { terminal_id: current.id, fares: collectFares() } });
  toast('운임 저장됨'); await load(current.id);
});
</script>
</body>
</html>
